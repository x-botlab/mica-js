name: CI

on:
  push:
    branches: [main]
    # Include the normative contracts consumed by conformance checks.
    paths:
      - 'examples/**'
      - 'tests/conformance/**'
      - 'docs/spec/contracts/**'
      - 'docs/spec/conformance.rst'
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'examples/**'
      - 'tests/conformance/**'
      - 'docs/spec/contracts/**'
      - 'docs/spec/conformance.rst'
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.github/workflows/ci.yml'

jobs:
  verify:
    # The changesets "Version Packages" PR only rewrites versions, CHANGELOGs and changeset files;
    # `release.yml` builds from the merge commit before publishing, so a full verify here would
    # only duplicate that work without adding signal.
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run build

      - run: pnpm run typecheck

      - name: Check conformance types and run Markdown cases
        run: |
          pnpm typecheck:conformance
          pnpm test:conformance

      - run: pnpm run test
