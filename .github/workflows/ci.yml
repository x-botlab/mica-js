name: CI

on:
  push:
    branches: [main]
    # Only code that this workflow verifies; docs / changeset-only pushes stay quiet.
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.github/workflows/ci.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run build

      - run: pnpm run lint:package

      - run: pnpm run test

      - run: pnpm --filter @mica-js/playground exec playwright install --with-deps chromium

      - run: pnpm run test:e2e
