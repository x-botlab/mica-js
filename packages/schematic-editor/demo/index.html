<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mica 原理图编辑器 — Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: var(--mica-schematic-ui-background, #0a0a0a);
        --surface: var(--mica-schematic-ui-surface, #171717);
        --border: var(--mica-schematic-ui-border, rgba(250, 250, 250, 0.1));
        --text: var(--mica-schematic-ui-text, #fafafa);
        --muted: var(--mica-schematic-ui-muted-text, #a1a1a1);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 44px;
        padding: 0 12px;
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 500;
      }
      header button {
        height: 26px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      header button:hover {
        border-color: var(--muted);
      }
      header .hint {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
      }
      main {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Mica 原理图编辑器</h1>
      <button id="theme" type="button">切换主题</button>
      <button id="fit" type="button">适应内容</button>
      <span class="hint" id="hint"
        >拖拽空白框选 · 空格旋转 · Delete 删除 · Ctrl+Z 撤销 · 中键平移 · 滚轮缩放</span
      >
    </header>
    <main id="host"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
